name: nusarta
description: "NUSARTA — Keuanganmu, Dalam Kendalimu. Aplikasi pencatatan keuangan pribadi."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <0.21.0"
  cupertino_icons: ^1.0.8

  # State / routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0

  # Charts
  fl_chart: ^0.68.0

  # Hashing (PBKDF2-style PIN hashing)
  crypto: ^3.0.3

  # Backend
  supabase_flutter: ^2.5.6
  http: ^1.2.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1

# app_links 6.4.x requires Flutter >= 3.27 (uses flutter.compileSdkVersion in
# its Android build.gradle). Our toolchain is Flutter 3.24.3, so pin the
# latest Flutter-3.24-compatible release (6.3.3 uses hardcoded compileSdk 34).
dependency_overrides:
  app_links: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
