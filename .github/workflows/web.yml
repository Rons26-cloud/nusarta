name: Web — Lint, Typecheck, Test, Build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Lint
        run: npm run lint --workspace=@nusarta/web

      - name: Typecheck
        run: npm run typecheck --workspace=@nusarta/web

      - name: Test
        run: npm run test --workspace=@nusarta/web

      - name: Build
        run: npm run build --workspace=@nusarta/web